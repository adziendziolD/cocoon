name: Publish sandbox images

# Multi-arch (amd64/arm64) builds of the sandbox image variants, published to the GitHub Container Registry:
#   ghcr.io/<owner>/cocoon-sandbox:slim (also :latest), :db, :full – plus :<variant>-<commit> and, for releases, :<variant>-<version>.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['images/sandbox/**', '.github/workflows/images.yml']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, db, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name and tags
        id: meta
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cocoon-sandbox"
          tags="$image:$VARIANT,$image:$VARIANT-${GITHUB_SHA::7}"
          [ "$VARIANT" != slim ] || tags="$tags,$image:latest"
          [ "$GITHUB_REF_TYPE" != tag ] || tags="$tags,$image:$VARIANT-${GITHUB_REF_NAME#v}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/sandbox
          platforms: linux/amd64,linux/arm64
          build-args: TOOLCHAIN=${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=CoCoon sandbox base image (${{ matrix.variant }})
            cocoon.variant=${{ matrix.variant }}
          cache-from: type=gha,scope=sandbox-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.variant }}
