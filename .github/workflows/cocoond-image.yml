name: Publish cocoond image

# The cocoond image for Kubernetes (deploy/kubernetes): ghcr.io/<owner>/cocoon:latest, :<commit> and, for releases, :<version>.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['packages/**', 'images/**', 'pnpm-lock.yaml', 'deploy/kubernetes/Dockerfile', '.github/workflows/cocoond-image.yml']
  workflow_dispatch:

concurrency:
  group: cocoond-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cocoon"
          tags="$image:latest,$image:${GITHUB_SHA::7}"
          [ "$GITHUB_REF_TYPE" != tag ] || tags="$tags,$image:${GITHUB_REF_NAME#v}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/kubernetes/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=CoCoon control plane (cocoond) for Kubernetes
          cache-from: type=gha,scope=cocoond
          cache-to: type=gha,mode=max,scope=cocoond
